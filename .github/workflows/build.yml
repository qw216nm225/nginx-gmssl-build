name: Build GM Nginx (nginx-gmssl + GmSSL)

# 国密版 nginx 编译流水线（B 方案：GmSSL 官方 nginx 分支 + GmSSL 密码库）
# 产物：x86_64（CentOS 7 兼容，glibc 2.17）+ aarch64（麒麟 V10/UOS 兼容，glibc 2.28）
# 组合：nginx-gmssl@7c70da7（基于 nginx 1.30.2）+ GmSSL v3.2.0
#
# 设计说明（沿用 tengine-gm-build 成熟模式）：
# 1. 编译在旧 glibc 容器内进行（保证产物兼容老系统），产物通过挂载卷落 runner 原生目录上传
# 2. 自测在编译容器内完成：nginx -t 校验 TLCP 双证书配置
# 3. CentOS 7 需要额外解决：cmake 3.x（GmSSL 3 构建要求）+ pcre2（nginx 1.30 仅支持 pcre2）

on:
  workflow_dispatch: # 手动触发

jobs:
  # ============ x86_64：CentOS 7 服务器用（含 TLCP 配置自测）============
  build-x86_64:
    runs-on: ubuntu-latest # x64 runner
    steps:
      - name: Checkout repo (test certs & selfcheck conf)
        uses: actions/checkout@v4

      - name: Build in CentOS 7 container (glibc 2.17)
        run: |
          docker run --rm -v "$PWD:/work" -w /work centos:7.9.2009 bash -c '
            set -e
            sed -i "s/mirrorlist=/#mirrorlist=/g" /etc/yum.repos.d/CentOS-*.repo
            sed -i "s|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g" /etc/yum.repos.d/CentOS-*.repo
            yum -y install gcc gcc-c++ make zlib-devel perl wget tar

            # CMake 3.x（CentOS 7 自带 2.8 太老，GmSSL 3 构建需要新版本）
            wget -c https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz
            tar xzf cmake-3.30.5-linux-x86_64.tar.gz
            export PATH=/work/cmake-3.30.5-linux-x86_64/bin:$PATH

            # pcre2（nginx 1.30 仅支持 pcre2；CentOS 7 无 pcre2-devel，源码编译装 /usr/local）
            wget -c https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.44/pcre2-10.44.tar.gz
            tar xzf pcre2-10.44.tar.gz
            cd pcre2-10.44
            ./configure --prefix=/usr/local
            make -j"$(nproc)"
            make install
            cd /work

            # GmSSL v3.2.0（装 /usr/local）
            wget -c https://github.com/guanzhi/GmSSL/archive/refs/tags/v3.2.0.tar.gz -O GmSSL-3.2.0.tar.gz
            tar xzf GmSSL-3.2.0.tar.gz
            cmake -S /work/GmSSL-3.2.0 -B /work/GmSSL-3.2.0/build -DCMAKE_BUILD_TYPE=Release
            cmake --build /work/GmSSL-3.2.0/build --parallel "$(nproc)"
            cmake --install /work/GmSSL-3.2.0/build
            ldconfig

            # nginx-gmssl（pin commit 7c70da7，GmSSL v3.2.0 兼容版）
            wget -c https://github.com/GmSSL/nginx-gmssl/archive/7c70da7686ac4991b78da122d458682734721918.tar.gz -O nginx-gmssl.tar.gz
            tar xzf nginx-gmssl.tar.gz
            cd nginx-gmssl-7c70da7686ac4991b78da122d458682734721918
            ./configure --prefix=/work/install/nginx \
              --with-http_ssl_module \
              --with-gmssl=/usr/local \
              --with-ld-opt="-Wl,-rpath,/usr/local/lib" \
              --with-http_realip_module \
              --with-http_stub_status_module \
              --with-http_gzip_static_module
            make -j"$(nproc)"
            make install

            # ===== 自测：TLCP 双证书配置检查（GmSSL 按 KeyUsage 区分签名/加密证书）=====
            echo "=== 自测 1/3：启用 TLCP 自测配置 ==="
            cp /work/ci/tlcp-selfcheck.conf /work/install/nginx/conf/nginx.conf
            mkdir -p /work/install/nginx/logs
            echo "=== 自测 2/3：nginx -t 配置检查 ==="
            /work/install/nginx/sbin/nginx -t -p /work/install/nginx
            echo "=== 自测 3/3：启动并验证监听 ==="
            /work/install/nginx/sbin/nginx -p /work/install/nginx
            sleep 1
            ps aux | grep -c "[n]ginx"
            echo "PASS: TLCP 配置加载成功，nginx 已启动"
            echo "=== 自测 4/4：TLCP 国密握手（GmSSL tlcp_client）==="
            echo | /usr/local/bin/gmssl tlcp_client -host 127.0.0.1 -port 8445 \
              > /work/handshake.log 2>&1
            cat /work/handshake.log
            if grep -q "Connection established" /work/handshake.log; then
              echo "PASS: TLCP 握手成功（GmSSL 客户端与 nginx-gmssl 互通）"
            else
              echo "FAIL: TLCP 握手失败"
              tail -20 /work/install/nginx/logs/tlcp-error.log
              exit 1
            fi
          '

      - name: Package artifact
        run: |
          sudo chown -R "$USER" install || true
          mkdir -p dist
          tar czf dist/nginx-gmssl-x86_64-centos7-glibc217.tar.gz -C install nginx
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-gmssl-x86_64
          path: dist/*.tar.gz
          retention-days: 30

  # ============ aarch64：麒麟 V10 / UOS 服务器用 ============
  build-aarch64:
    runs-on: ubuntu-24.04-arm # arm64 runner（公开仓库免费）
    steps:
      - name: Build in AlmaLinux 8 container (glibc 2.28)
        run: |
          docker run --rm -v "$PWD:/work" -w /work almalinux:8 bash -c '
            set -e
            dnf -y install gcc gcc-c++ make zlib-devel perl wget tar cmake pcre2-devel

            # GmSSL v3.2.0（装 /usr/local）
            wget -c https://github.com/guanzhi/GmSSL/archive/refs/tags/v3.2.0.tar.gz -O GmSSL-3.2.0.tar.gz
            tar xzf GmSSL-3.2.0.tar.gz
            cmake -S /work/GmSSL-3.2.0 -B /work/GmSSL-3.2.0/build -DCMAKE_BUILD_TYPE=Release
            cmake --build /work/GmSSL-3.2.0/build --parallel "$(nproc)"
            cmake --install /work/GmSSL-3.2.0/build
            ldconfig

            # nginx-gmssl（pin commit 7c70da7）
            wget -c https://github.com/GmSSL/nginx-gmssl/archive/7c70da7686ac4991b78da122d458682734721918.tar.gz -O nginx-gmssl.tar.gz
            tar xzf nginx-gmssl.tar.gz
            cd nginx-gmssl-7c70da7686ac4991b78da122d458682734721918
            ./configure --prefix=/work/install/nginx \
              --with-http_ssl_module \
              --with-gmssl=/usr/local \
              --with-ld-opt="-Wl,-rpath,/usr/local/lib" \
              --with-http_realip_module \
              --with-http_stub_status_module \
              --with-http_gzip_static_module
            make -j"$(nproc)"
            make install
          '

      - name: Package artifact
        run: |
          sudo chown -R "$USER" install || true
          mkdir -p dist
          tar czf dist/nginx-gmssl-aarch64-kyv10-glibc228.tar.gz -C install nginx
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-gmssl-aarch64
          path: dist/*.tar.gz
          retention-days: 30
