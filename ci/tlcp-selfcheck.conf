# 云端自测配置：TLCP 双证书（参考 nginx-gmssl 官方 gmssl-tests/tlcp.conf）
# 运行环境：CentOS 7 编译容器内，prefix=/work/install/nginx，证书挂载于 /work/test-certs
worker_processes  1;

error_log  logs/tlcp-error.log;
pid        logs/tlcp.pid;

events {
    worker_connections  64;
}

http {
    access_log logs/tlcp-access.log;

    server {
        listen 8445 ssl;
        server_name localhost;

        ssl_protocols TLCP;
        ssl_certificate     /work/test-certs/double_certs.pem;
        ssl_certificate_key /work/test-certs/double_keys.pem;
        ssl_password_file   /work/test-certs/pass.txt;

        root html;
    }
}
